[project]
name = "pushthrough-backend"
version = "0.1.0"
description = "Local notebook course runtime for Pushthrough"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.0",
    "ipykernel>=6.30.0",
    "jupyter-client>=8.6.0",
    "nbformat>=5.10.0",
    "pyright>=1.1.411",
    "torch>=2.12.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
